[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-sdk"
version = "0.1.0"
description = "Claude-style four-layer agent memory: transcripts, notes, wiki, injected index, maintained by an offline Dreaming engine, with zvec hybrid retrieval"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "zvec>=0.8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
agents = ["openai-agents>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
